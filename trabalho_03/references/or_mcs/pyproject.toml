[project]
name = "or-mcs-demo"
version = "0.1.0"
description = "OR-MCS demonstration for PhD proposal"
requires-python = ">=3.12"

dependencies = [
    "numpy>=1.20.0",
    "matplotlib>=3.3.0",
    "scikit-learn>=1.0.0",
    "arch>=6.0.0",
    "pandas>=2.0.0",
    "lightgbm>=4.0.0",
    "joblib>=1.3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

