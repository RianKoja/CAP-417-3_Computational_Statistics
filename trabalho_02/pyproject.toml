[project]
name = "trabalho-02"
version = "0.1.0"
description = "Computational Statistics - Assignment 02"
requires-python = ">=3.12"

dependencies = [
    "numpy>=1.20.0",
    "matplotlib>=3.3.0",
    "scikit-learn>=1.0.0",
    "arch>=6.0.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "yfinance>=0.2.0",
    "joblib>=1.3.0",
]

[tool.setuptools]
packages = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
